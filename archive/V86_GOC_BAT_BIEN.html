function badge(v){return `<span class="badge ${v<80?'red':v<=110?'yellow':'green'}">${v<80?'ĐỎ':v<=110?'VÀNG':'XANH'}</span>`}
function dayRange(day,per){let d=new Date(day+'T12:00:00'),start=new Date(d);if(per==='week')start.setDate(d.getDate()-(d.getDay()+6)%7);if(per==='month')start=new Date(d.getFullYear(),d.getMonth(),1,12);if(per==='quarter')start=new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1,12);if(per==='year')start=new Date(d.getFullYear(),0,1,12);return start.toLocaleDateString('en-CA')}
function localISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function startDay(day,per){let d=new Date(day+'T12:00:00');if(per==='week')d.setDate(d.getDate()-(d.getDay()+6)%7);if(per==='month')d.setDate(1);if(per==='quarter'){d.setMonth(Math.floor(d.getMonth()/3)*3);d.setDate(1)}if(per==='year'){d.setMonth(0);d.setDate(1)}return localISO(d)}
function demoKpi(emp,per){let base=emp.score||0,off={day:6,week:2,month:0,quarter:-1,year:-2}[per];return Math.max(0,base+off)}
function kpi(emp,per,day){let start=startDay(day,per),items=state.kpis.filter(x=>x.emp===emp.id&&x.day>=start&&x.day<=day&&x.approved);if(items.length)return {value:Math.round(items.reduce((a,x)=>a+x.value,0)/items.length),source:'đã xác nhận',count:items.length};return {value:demoKpi(emp,per),source:'mô phỏng',count:0}}
function progress(day){const d=new Date(day+'T12:00:00'),st=new Date(d.getFullYear(),d.getMonth(),1,12),end=new Date(d.getFullYear(),d.getMonth()+1,0,12);let total=0,done=0;for(let x=new Date(st);x<=end;x.setDate(x.getDate()+1)){if(x.getDay()!==0){total++;if(x<=d)done++}}return total?done/total:0}
function reward(emp,score){if(score<80)return 0;if(score<100)return emp.bonus*score/100;if(score<=110)return emp.bonus;return emp.bonus*(1+Math.min((score-110)*.02,.5))}
function income(emp,day){const m=kpi(emp,'month',day),fraction=progress(day),fixed=emp.base*fraction,bonus=reward(emp,m.value)*fraction,commission=emp.commissionRate?state.orders.filter(o=>o.owner===emp.id&&o.paidAt&&o.paidAt<=day&&o.status==='Đã thu tiền').reduce((t,o)=>t+(Number(o.paid)||0)*emp.commissionRate,0):0;return {fixed,bonus,commission,total:fixed+bonus+commission,source:m.source}}

function tasksFor(emp,day){const start=startDay(day,'week');let dayTasks=state.tasks.filter(t=>t.owner===emp.id&&t.day===day),weekTasks=state.tasks.filter(t=>t.owner===emp.id&&t.day>=start&&t.day<=day);let defaults=roleTasks(emp);return {today:dayTasks.length?dayTasks.map(t=>t.title).join('; '):defaults[0],todayGoal:dayTasks.length?dayTasks.map(t=>t.target).join('; '):defaults[1],week:weekTasks.length?weekTasks.map(t=>t.title).join('; '):defaults[2],weekGoal:weekTasks.length?weekTasks.map(t=>t.target).join('; '):defaults[3],isDemo:!dayTasks.length||!weekTasks.length}}

function costsView(){
 const groups=[
 ['admin','Hành chính, văn phòng','Rà soát dịch vụ trùng, hợp đồng thuê và mua sắm không cần thiết'],
 ['electric','Điện, thiết bị phụ trợ','Đo điện theo ca; tìm thời gian máy trộn, vít tải, hút bụi chạy không tải'],
 ['transport','Vận chuyển, giao hàng','Gộp tuyến giao, đối chiếu giá mỗi km và tỷ lệ giao đúng hẹn'],
 ['rework','Sửa lỗi, làm lại','Tìm 3 nguyên nhân gây sản phẩm không đạt QC và chi phí tái sản xuất'],
 ['warehouse','Kho và hao hụt','Đối chiếu nhập xuất tồn, định mức hao hụt, kiểm kê theo mã lô'],
 ['sales','Chi phí bán hàng','So sánh chi phí có đơn thu tiền thực; dừng kênh không hiệu quả'],
 ['other','Chi phí quản trị khác','Phân loại lại chứng từ và kiểm tra các khoản bất thường']
 ];
 const month=(date.value||'2026-10-24').slice(0,7);
 if(!state.costAnalysis)state.costAnalysis={};
 const entry=state.costAnalysis[month]||{};
 const rows=groups.map(([id,name,advice])=>({id,name,advice,base:Number(entry[id]?.base??0),actual:Number(entry[id]?.actual??0)}));
 const hasData=rows.some(r=>r.base>0||r.actual>0);
 const base=rows.reduce((a,r)=>a+r.base,0),actual=rows.reduce((a,r)=>a+r.actual,0),target=base*.97,gap=Math.max(0,actual-target);
 const ranked=rows.filter(r=>r.base>0||r.actual>0).map(r=>({...r,delta:r.actual-r.base,share:actual?r.actual/actual:0})).sort((a,b)=>b.delta-a.delta||b.actual-a.actual);
 const advice=ranked.map((r,i)=>`<article style="padding:13px;border:1px solid #dce5e8;border-radius:12px;margin:8px 0"><b>${i+1}. ${r.name}</b> · ${fmt(r.actual)} (${Math.round(r.share*100)}% tổng chi phí) · ${r.delta>0?'TĂNG '+fmt(r.delta):r.delta<0?'GIẢM '+fmt(-r.delta):'KHÔNG ĐỔI'}<p>${r.advice}</p><small>AI đề xuất kiểm chứng: hóa đơn, nhật ký hoạt động, sản lượng đạt QC; giám đốc phê duyệt sau đối chiếu.</small></article>`).join('');
 $('main').innerHTML=`<section class="panel"><h2>Giám đốc · Phân tích giảm 3% chi phí quản trị</h2><p><b>Tháng ${month}</b> · Chỉ tính các khoản được nhập bên dưới. Phân tích theo cả tháng; không tự suy diễn từ một ngày.</p><div class="grid"><div class="tile"><small>Chi phí tháng gốc</small><strong>${hasData?fmt(base):'Chưa nhập'}</strong></div><div class="tile"><small>Chi phí tháng phân tích</small><strong>${hasData?fmt(actual):'Chưa nhập'}</strong></div><div class="tile"><small>Mục tiêu giảm 3%</small><strong>${hasData?fmt(target):'Chưa nhập'}</strong></div><div class="tile"><small>Khoản cần cắt giảm thêm</small><strong>${hasData?fmt(gap):'Chưa xác định'}</strong></div></div><p class="notice">${hasData?(actual<=target?'Đã đạt mục tiêu theo số liệu nhập.':'Chưa đạt: cần tiết giảm thêm '+fmt(gap)):'Chưa có dữ liệu chi phí theo từng khoản. Nhập chi phí của tháng gốc và tháng cần phân tích để AI đưa ra thứ tự ưu tiên.'}</p><h3>1. Nhập chi phí từng khoản (đồng)</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Khoản mục</th><th>Tháng gốc</th><th>Tháng phân tích</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="padding:8px">${r.name}</td><td><input style="width:140px;max-width:100%" type="number" min="0" step="1000" id="base_${r.id}" value="${r.base}"></td><td><input style="width:140px;max-width:100%" type="number" min="0" step="1000" id="actual_${r.id}" value="${r.actual}"></td></tr>`).join('')}</tbody></table></div><button class="primary" id="saveCostMonth">Lưu tháng và phân tích lại</button><h3>2. AI tư vấn giám đốc: nên giảm khoản nào?</h3>${hasData?advice:'<p>Chưa có căn cứ để xếp hạng khoản tiết giảm. Không đưa ra kết luận giả.</p>'}<h3>3. Quy trình quyết định</h3><p>Đối chiếu chứng từ → phân tích nguyên nhân tăng chi phí → xác định khoản giảm khả thi → giao người chịu trách nhiệm và thời hạn → giám đốc phê duyệt → đo lại tháng sau. Không tiết giảm bằng cách bỏ kiểm tra chất lượng, bảo hộ hoặc nghĩa vụ pháp luật.</p><p class="hint">Bản này là bộ phân tích quy tắc hỗ trợ AI Agent; chưa kết nối mô hình AI qua máy chủ. Dữ liệu nhập thử lưu trên trình duyệt, không phải sổ kế toán chính thức.</p></section>`;
 $('saveCostMonth').onclick=()=>{
  const next={};
  for(const r of rows){const b=Number($('base_'+r.id).value),a=Number($('actual_'+r.id).value);if(!Number.isFinite(b)||!Number.isFinite(a)||b<0||a<0){alert('Chi phí không hợp lệ');return}next[r.id]={base:b,actual:a}}
  state.costAnalysis[month]=next;save();render();
 };
}

who.onchange=()=>{current=Number(who.value);hrSelected='';tab='kpi';render()};date.onchange=render;$('period').onchange=()=>{tab='kpi';render()};$('aiButton').onclick=()=>{$('aiBox').classList.toggle('open')};$('ask').onclick=()=>{let q=$('question').value.toLowerCase(),emp=p(),reply='Tôi chỉ có thể phân tích dữ liệu mô phỏng và các quy tắc đã nhập; chưa kết nối AI thực.';if(q.includes('kpi'))reply=`KPI ${emp.ten}: hôm nay ${kpi(emp,'day',date.value).value}%, tuần ${kpi(emp,'week',date.value).value}%, tháng ${kpi(emp,'month',date.value).value}%. Các tỷ lệ là dữ liệu mô phỏng nếu chưa có chứng cứ.`;else if(q.includes('lương')||q.includes('thu nhập'))reply=`Thu nhập tạm tính đến ${date.value}: ${fmt(income(emp,date.value).total)} = lương theo công + thưởng KPI${emp.commissionRate?' + hoa hồng đủ điều kiện':''}.`;else if(q.includes('3%')||q.includes('chi phí'))reply=admin()?`Mở mục Giám đốc → Giảm 3% chi phí, nhập số tiền từng khoản của tháng gốc và tháng phân tích. Hệ thống sẽ xếp hạng khoản tăng chi phí, gợi ý cách tiết giảm và chứng cứ cần kiểm tra. Không tự phê duyệt.`:'Bạn không có quyền xem chi phí toàn công ty.';else if(q.includes('vi phạm'))reply=admin()?`Có ${state.violations.length} hồ sơ ghi nhận, cần xác minh chứng cứ trước khi quyết định.`:'Vi phạm phải có chứng cứ và được người có thẩm quyền xử lý.';else if(q.includes('đơn hàng'))reply=`Đang có ${D.orders.length+state.orders.length} đơn trong dữ liệu thử. Không coi đơn mô phỏng là tiền thu thực.`;$('messages').textContent='Câu hỏi: '+$('question').value+'\n\n'+reply};render();</script></body></html>
